x-namespace: port1/systems/zero/capability-interfaces/media-player
x-name: audio
x-version: '1.0'
x-type: configuration
description: Schema for audio interface configuration validation
type: object
properties:
  supportedFormats:
    type: array
    description: List of supported audio formats
    items:
      type: string
      enum:
        - mp3
        - wav
        - ogg
        - aac
        - flac
        - m4a
    default:
      - mp3
      - wav
  maxSampleRate:
    type: integer
    description: Maximum supported sample rate in Hz
    enum:
      - 8000
      - 16000
      - 22050
      - 44100
      - 48000
    default: 48000
  maxChannels:
    type: integer
    description: Maximum number of supported audio channels
    minimum: 1
    maximum: 8
    default: 2
  maxBitDepth:
    type: integer
    description: Maximum supported bit depth
    enum:
      - 8
      - 16
      - 24
      - 32
    default: 32
  maxDuration:
    type: number
    description: Maximum audio duration in seconds
    minimum: 0
  bufferSize:
    type: integer
    description: Audio buffer size in samples
    minimum: 1024
    maximum: 65536
    default: 4096
additionalProperties: false
