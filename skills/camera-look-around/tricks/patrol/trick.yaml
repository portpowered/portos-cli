name: patrol
does: Checks left, the middle and right. Glides to 90 degrees left of the middle of the pan range, the middle, and 90 degrees right of it, saves a frame at each, and ends at the middle. Anchors pan first when it is not known.
run: python3 tricks/patrol/run.py <camera> --out patrol/
parameters:
  spread: degrees either side of the middle to check (default 90)
  tilt: tilt angle up from the bottom end to patrol at (default where the camera already points)
  out: directory for the frames
checkpoints:
  patrol: the three frames (left, middle, right) with their angles; you look at each and say what you checked
validated: never
runs: 0
successes: 0
notes: []
